[package]
name = "warp-folding"
version = "0.1.0"
edition = "2021"
authors = ["Paul DeLucia"]
description = "WARP (Linear-Time Accumulation Schemes, Bünz/Chiesa/Fenzi/Wang, eprint 2025/753) over M31Ext3 + parallel-rep r=2"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/willow-network/warp-folding"
readme = "README.md"
keywords = ["cryptography", "zk", "folding", "accumulation", "warp"]
categories = ["cryptography"]

# First public production implementation of "Linear-Time Accumulation
# Schemes" (Bünz, Chiesa, Fenzi, Wang, eprint 2025/753, TCC 2025).
# Instantiated over the Polyhedra Expander M31 stack with
# parallel-repetition r=2 for 128-bit soundness over M31Ext3.
# See docs/warp-over-m31.md for design rationale.

[dependencies]
expander-arith = { git = "https://github.com/willow-network/Expander", rev = "cce9b0f05f38b9ab2de57d2ff175a1b4b31b78ae", package = "arith" }
expander-mersenne31 = { git = "https://github.com/willow-network/Expander", rev = "cce9b0f05f38b9ab2de57d2ff175a1b4b31b78ae", package = "mersenne31" }
expander-polynomials = { git = "https://github.com/willow-network/Expander", rev = "cce9b0f05f38b9ab2de57d2ff175a1b4b31b78ae", package = "polynomials" }
# `#[derive(ExpSerde)]` proc macro emits `::serdes::ExpSerde` paths, so
# the dep is named `serdes` rather than `expander-serdes`. Hand-written
# imports use `serdes::ExpSerde`.
serdes = { git = "https://github.com/willow-network/Expander", rev = "cce9b0f05f38b9ab2de57d2ff175a1b4b31b78ae", package = "serdes" }

rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
sha3 = "0.10"
blake3 = "1"
thiserror = "1.0"
itertools = "0.13"

[dev-dependencies]
criterion = "0.5"
# Smoke test for the WARP-GF2 micro-spike: confirms WarpProverState
# instantiates over GF2_128. Same Expander rev as the production deps
# so there's no native-library coexistence issue.
expander-gf2_128 = { git = "https://github.com/willow-network/Expander", rev = "cce9b0f05f38b9ab2de57d2ff175a1b4b31b78ae", package = "gf2_128" }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"], optional = true }
which = { version = "4.0", optional = true }

[features]
default = []
# Compiles M31Ext3 sumcheck kernels via nvcc and exposes a GPU prove
# path on machines with a CUDA toolkit installed. Build is a no-op if
# `nvcc` is not in PATH; the feature flag still pulls in cc/which for
# the build.rs.
cuda = ["dep:cc", "dep:which"]

[[bench]]
name = "fold"
harness = false

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
result_large_err = "allow"
large_enum_variant = "allow"
